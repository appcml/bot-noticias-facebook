name: Bot Noticias V21 Evergreen

on:
  schedule:
    # 3 corridas exactas — 1 borrador por corrida = 3 borradores/día
    # Horarios optimizados para audiencia LATAM:
    #   07:00 UTC = 04:00 Chile/Arg | 01:00 MX  → indexa temprano, listo al despertar
    #   13:00 UTC = 10:00 Chile/Arg | 07:00 MX  → pico mañana
    #   19:00 UTC = 16:00 Chile/Arg | 13:00 MX  → pico tarde
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar publicación (omite control de cuota y hora)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot noticias V21
        env:
          # APIs de Noticias
          NEWS_API_KEY:        ${{ secrets.NEWS_API_KEY }}
          NEWSDATA_API_KEY:    ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY:       ${{ secrets.GNEWS_API_KEY }}
          # WordPress
          WP_URL:              ${{ secrets.WP_URL }}
          WP_USER:             ${{ secrets.WP_USER }}
          WP_APP_PASSWORD:     ${{ secrets.WP_APP_PASSWORD }}
          # IA
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY:      ${{ secrets.TAVILY_API_KEY }}
          # GitHub
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          # Control
          HISTORIAL_PATH:      historial_publicaciones.json
          FORZAR_PUBLICACION:  ${{ github.event.inputs.forzar || 'false' }}
        run: python bot_noticias.py

      - name: Guardar estado en repositorio
        if: always()
        run: |
          git config user.name  "bot-noticias[bot]"
          git config user.email "bot-noticias@users.noreply.github.com"
          ARCHIVOS=(
            historial_publicaciones.json
            estado_wp.json
            estado_cuotas.json
            estado_rotacion_paises.json
          )
          for archivo in "${ARCHIVOS[@]}"; do
            if [ -f "$archivo" ]; then git add "$archivo"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios en estado"
          else
            git commit -m "📰 Estado bot noticias V21 [skip ci]"
            git push
            echo "Estado guardado"
          fi

      - name: Subir artefacto de estado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-noticias-${{ github.run_number }}
          path: |
            historial_publicaciones.json
            estado_wp.json
            estado_cuotas.json
            estado_rotacion_paises.json
          retention-days: 7
