name: Bot Pinterest Diferido V2

on:
  schedule:
    # Corre cada 2 horas — publica pines de articulos ya editados y publicados
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Ignorar retraso de horas (publica aunque sea reciente)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      forzar_post_id:
        description: 'ID de post especifico a pinear (dejar vacio para modo normal)'
        required: false
        default: ''

jobs:
  pinterest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar bot Pinterest diferido
        env:
          PINTEREST_TOKEN:        ${{ secrets.PINTEREST_TOKEN }}
          WP_URL:                 ${{ secrets.WP_URL }}
          FORZAR:                 ${{ github.event.inputs.forzar || 'false' }}
          FORZAR_POST_ID:         ${{ github.event.inputs.forzar_post_id || '' }}
          RETRASO_HORAS:          '2'
          VENTANA_MAX_DIAS:       '10'
          MAX_PINS_POR_EJECUCION: '5'
          TIEMPO_ENTRE_PINS_SEG:  '8'
          MAX_INTENTOS_FALLIDOS:  '5'
          TABLERO_DEFECTO:        'noticias-del-mundo'
          ESTADO_PATH:            estado_pinterest_diferido.json

        run: python bot_pinterest_diferido.py

      - name: Guardar estado Pinterest en repositorio
        if: always()
        run: |
          git config user.name  "bot-pinterest[bot]"
          git config user.email "bot-pinterest@users.noreply.github.com"

          if [ -f "estado_pinterest_diferido.json" ]; then
            git add estado_pinterest_diferido.json
          fi

          if git diff --cached --quiet; then
            echo "Sin cambios en estado Pinterest"
          else
            git commit -m "📌 Estado Pinterest diferido [skip ci]"
            git push
            echo "Estado Pinterest guardado"
          fi

      - name: Subir artefacto de estado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-pinterest-${{ github.run_number }}
          path: estado_pinterest_diferido.json
          retention-days: 7
